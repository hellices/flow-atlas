name: skill-eval

# Runs the flow-atlas skill with a coding agent (Copilot CLI, through Vally) on fixtures/shop and grades what the
# agent ran, said and changed. It costs model requests, so it runs on demand, weekly, and after a change to the skill
# lands on main; not on every pull request, and never on a fork's (which gets neither the token nor the permission).

on:
  workflow_dispatch:
    inputs:
      runs:
        description: trials per stimulus
        default: "3"
  schedule:
    - cron: "41 5 * * 2"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - ".github/workflows/skill-eval.yml"

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: skill-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The CLI under test is the one this checkout builds, installed where the agent finds it on PATH.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install -g "$RUNNER_TEMP"/pack/flow-atlas-*.tgz
          atlas --help > /dev/null
      - name: vally eval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALLY_TELEMETRY_OPTOUT: "1"
          # The dispatch input reaches the shell as a variable, never as source.
          RUNS: ${{ inputs.runs || '3' }}
        run: |
          case "$RUNS" in ''|*[!0-9]*|0) echo "runs is a positive integer, not '$RUNS'" >&2; exit 2;; esac
          # vally exits non-zero on any trial error; the verdict step reads the trials instead.
          npx -y @microsoft/vally-cli@0.21.0 eval \
            --eval-spec evals/flow-atlas/eval.yaml \
            --runs "$RUNS" \
            --workers 2 \
            --junit \
            --output-dir eval-results || true
      # A trial whose agent session dropped or timed out (status error) is no evidence either way. Every graded trial
      # must pass, and every stimulus of the spec needs at least one.
      - name: verdict
        run: |
          results=$(ls eval-results/*/results.jsonl)
          stimuli=$(grep -cE '^  - name: ' evals/flow-atlas/eval.yaml)
          jq -rs '[.[] | select(.stimulus)] | group_by(.stimulus)[] | "\(.[0].stimulus): \([.[] | select(.status == "success" and .gradeResult.passed == true)] | length) passed, \([.[] | select(.status == "success" and .gradeResult.passed != true)] | length) failed, \([.[] | select(.status != "success")] | length) errored"' $results | tee -a "$GITHUB_STEP_SUMMARY"
          jq -se --argjson stimuli "$stimuli" '[.[] | select(.stimulus)] | group_by(.stimulus) | length == $stimuli and all(any(.[]; .status == "success") and all(.[]; .status != "success" or .gradeResult.passed == true))' $results > /dev/null
      - name: upload trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-results
          path: eval-results/
