name: skill-eval

# Runs the flow-atlas skill with a coding agent (Copilot CLI, through Vally) on fixtures/shop and grades what the
# agent ran, said and changed. It costs model requests, so it runs on demand, weekly, and after a change to the skill
# lands on main; not on every pull request, and never on a fork's (which gets neither the token nor the permission).

on:
  workflow_dispatch:
    inputs:
      runs:
        description: trials per stimulus
        default: "3"
  schedule:
    - cron: "41 5 * * 2"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - ".github/workflows/skill-eval.yml"

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: skill-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The CLI under test is the one this checkout builds, installed where the agent finds it on PATH.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install -g "$RUNNER_TEMP"/pack/flow-atlas-*.tgz
          atlas --help > /dev/null
      - name: vally eval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALLY_TELEMETRY_OPTOUT: "1"
        run: >
          npx -y @microsoft/vally-cli@0.21.0 eval
          --eval-spec evals/flow-atlas/eval.yaml
          --runs "${{ inputs.runs || '3' }}"
          --workers 2
          --require-pass
          --junit
          --output-dir eval-results
      - name: upload trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-results
          path: eval-results/
