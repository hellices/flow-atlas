name: frameworks

# Installs each framework under fixtures/frameworks, asks it again for the routes its application serves and fails when
# they differ from routes.json. Weekly, and on demand, it does so on each framework's latest release.
on:
  pull_request:
    paths: ["fixtures/frameworks/**", "scripts/frameworks.mjs", ".github/workflows/frameworks.yml"]
  push:
    branches: [main]
    paths: ["fixtures/frameworks/**", "scripts/frameworks.mjs", ".github/workflows/frameworks.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      latest:
        description: install each framework's latest release instead of the locked one
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  routes:
    name: ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fixture: express, toolchain: node }
          - { fixture: fastify, toolchain: node }
          - { fixture: koa, toolchain: node }
          - { fixture: hono, toolchain: node }
          - { fixture: nest, toolchain: node }
          - { fixture: nextjs, toolchain: node }
          - { fixture: fastapi, toolchain: python }
          - { fixture: flask, toolchain: python }
          - { fixture: django, toolchain: python }
          - { fixture: spring, toolchain: java }
          - { fixture: aspnetcore, toolchain: dotnet }
          - { fixture: gin, toolchain: go }
          - { fixture: chi, toolchain: go }
          - { fixture: nethttp, toolchain: go }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.toolchain == 'python'
        uses: astral-sh/setup-uv@v6
      - if: matrix.toolchain == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - if: matrix.toolchain == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - if: matrix.toolchain == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: fixtures/frameworks/*/go.sum
      - name: ask the framework for its routes and compare them with routes.json
        env:
          DOTNET_NOLOGO: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          LATEST: ${{ github.event_name == 'schedule' || inputs.latest == true }}
        run: node scripts/frameworks.mjs ${{ matrix.fixture }} --check $([ "$LATEST" = true ] && echo --latest)
