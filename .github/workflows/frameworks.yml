name: frameworks

# Installs each framework under fixtures/frameworks, asks it again for the routes its application serves and fails when
# they differ from routes.json. Weekly, and on demand, it does so on each framework's latest release. A push to a
# `frameworks/**` branch runs it too, and every run hands back, as an artifact, what each fixture reported (its
# routes.json, and calls.json or dispatch.json where it has one, whether or not they changed) and every other file
# the run changed or added (lock files written on the way), for fixtures on a toolchain a contributor does not have
# installed.
on:
  pull_request:
    paths: ["fixtures/frameworks/**", "scripts/frameworks.mjs", ".github/workflows/frameworks.yml"]
  push:
    branches: [main, "frameworks/**"]
    paths: ["fixtures/frameworks/**", "scripts/frameworks.mjs", ".github/workflows/frameworks.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      latest:
        description: install each framework's latest release instead of the locked one
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A push to a frameworks/** branch runs only the fixtures it changes since the branch it starts from: of main and
      # the feature branches, the one with the fewest commits between its merge base and the push.
      - id: list
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          names=""
          if [ "${{ github.event_name }}" = push ] && [ "${BRANCH#frameworks/}" != "$BRANCH" ]; then
            base=""; best=""
            for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/feat/*'); do
              n=$(git rev-list --count "$(git merge-base "$ref" HEAD)..HEAD")
              if [ -z "$best" ] || [ "$n" -lt "$best" ]; then best=$n; base=$ref; fi
            done
            echo "changes since $base"
            names=$(git diff --name-only "$(git merge-base "$base" HEAD)" HEAD -- fixtures/frameworks | cut -d/ -f3 | sort -u | tr '\n' ' ')
            [ -n "$names" ] || names=none
          fi
          echo "matrix=$(node scripts/frameworks.mjs --matrix $names)" >> "$GITHUB_OUTPUT"

  routes:
    name: ${{ matrix.fixture }}
    needs: fixtures
    if: needs.fixtures.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fixtures.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.toolchain == 'python'
        uses: astral-sh/setup-uv@v6
      - if: matrix.toolchain == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.toolchain == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - if: matrix.toolchain == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - if: matrix.toolchain == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.toolchain == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - if: matrix.toolchain == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - if: matrix.toolchain == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - if: matrix.toolchain == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.toolchain == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The runner image ships Swift; setup-swift does not support its Ubuntu release.
      - if: matrix.toolchain == 'swift'
        run: swift --version
      - if: matrix.toolchain == 'dart'
        uses: dart-lang/setup-dart@v1
      - name: ask the framework for its routes and compare them with routes.json
        env:
          DOTNET_NOLOGO: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          LATEST: ${{ github.event_name == 'schedule' || inputs.latest == true }}
        run: node scripts/frameworks.mjs ${{ matrix.fixture }} --check --keep $([ "$LATEST" = true ] && echo --latest)
      # What the fixture reported, written back by --keep, is handed back as it stands: git lists it only when it
      # differs from the committed file.
      - name: collect what the framework wrote
        if: always()
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          keep() { [ -f "$1" ] && mkdir -p "$RUNNER_TEMP/out/$(dirname "$1")" && cp "$1" "$RUNNER_TEMP/out/$1"; return 0; }
          for dir in "fixtures/frameworks/$FIXTURE" "fixtures/clients/$FIXTURE"; do
            [ -d "$dir" ] || continue
            for f in routes.json calls.json dispatch.json; do keep "$dir/$f"; done
            git status --porcelain --untracked-files=all -- "$dir" | cut -c4- | while read -r f; do keep "$f"; done
          done
          ls -R "$RUNNER_TEMP/out" | head -50
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameworks-${{ matrix.fixture }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
