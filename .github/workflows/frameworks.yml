name: frameworks

# Installs each framework under fixtures/frameworks, asks it again for the routes its application serves and fails when
# they differ from routes.json. Weekly, and on demand, it does so on each framework's latest release. A push to a
# `frameworks/**` branch runs it too, and every run hands back what each framework reported (routes.json, and lock
# files written on the way) as an artifact, for fixtures on a toolchain a contributor does not have installed.
on:
  pull_request:
    paths: ["fixtures/frameworks/**", "scripts/frameworks.mjs", ".github/workflows/frameworks.yml"]
  push:
    branches: [main, "frameworks/**"]
    paths: ["fixtures/frameworks/**", "scripts/frameworks.mjs", ".github/workflows/frameworks.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      latest:
        description: install each framework's latest release instead of the locked one
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: list
        run: echo "matrix=$(node scripts/frameworks.mjs --matrix)" >> "$GITHUB_OUTPUT"

  routes:
    name: ${{ matrix.fixture }}
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fixtures.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.toolchain == 'python'
        uses: astral-sh/setup-uv@v6
      - if: matrix.toolchain == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.toolchain == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - if: matrix.toolchain == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - if: matrix.toolchain == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.toolchain == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - if: matrix.toolchain == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - if: matrix.toolchain == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - if: matrix.toolchain == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.toolchain == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: ask the framework for its routes and compare them with routes.json
        env:
          DOTNET_NOLOGO: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          LATEST: ${{ github.event_name == 'schedule' || inputs.latest == true }}
        run: node scripts/frameworks.mjs ${{ matrix.fixture }} --check --keep $([ "$LATEST" = true ] && echo --latest)
      - name: collect what the framework wrote
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git status --porcelain --untracked-files=all -- "fixtures/frameworks/${{ matrix.fixture }}" | cut -c4- | while read -r f; do
            [ -f "$f" ] && mkdir -p "$RUNNER_TEMP/out/$(dirname "$f")" && cp "$f" "$RUNNER_TEMP/out/$f"
          done
          ls -R "$RUNNER_TEMP/out" | head -50
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frameworks-${{ matrix.fixture }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
