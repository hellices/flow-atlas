# How scripts/frameworks.mjs installs Tornado and asks it for the routes the application serves. requirements.txt pins
# every package with its hashes and names no index, so each machine installs the same files from the index it uses.
toolchain: python
docs:
  - https://www.tornadoweb.org/en/stable/guide/structure.html
  - https://www.tornadoweb.org/en/stable/routing.html
  - https://www.tornadoweb.org/en/stable/web.html
  - https://www.tornadoweb.org/en/stable/guide/running.html#static-files-and-aggressive-file-caching
  - https://www.tornadoweb.org/en/stable/websocket.html
setup: uv venv -q --allow-existing && uv pip sync -q requirements.txt
latest: uv venv -q --allow-existing && uv pip install -q --upgrade -r pyproject.toml
oracle: .venv/bin/python oracle.py
