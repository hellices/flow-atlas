# Where atlas's reading differs from the routes Fastify serves. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs.
missing:
  - { route: "GET /hello", reason: "the full declaration `fastify.route({ method, url })` is not read, and nothing says so" }
  - { route: "POST /items", reason: "the full declaration `fastify.route({ method: [...], path })` is not read, and nothing says so" }
  - { route: "PUT /items", reason: "the full declaration `fastify.route({ method: [...], path })` is not read, and nothing says so" }
  - { route: "GET /versioned", reason: "the full declaration `fastify.route({ method, url, constraints })` is not read, and nothing says so" }
  - { route: "QUERY /search", reason: "the `fastify.query` shorthand (QUERY method) is not read, and nothing says so" }
  - { route: "GET /v1/user", reason: "the routes of a plugin registered with `{ prefix }` are read without the prefix, and nothing says so" }
  - { route: "GET /v2/user", reason: "the routes of a plugin registered with `{ prefix }` are read without the prefix, and nothing says so" }
  - { route: "DELETE /v2/user/{}", reason: "the routes of a plugin registered with `{ prefix }` are read without the prefix, and nothing says so" }
  - { route: "GET /api", reason: "the routes of an inline plugin registered with `{ prefix }` are read without the prefix (its `/` as the root's), and nothing says so" }
  - { route: "GET /api/admin/dashboard", reason: "the routes of a plugin registered with `{ prefix }` inside another are read without either prefix, and nothing says so" }
  - { route: "PATCH /api/admin/settings/{}", reason: "the routes of a plugin registered with `{ prefix }` inside another are read without either prefix, and nothing says so" }
  - { route: "GET /public", reason: "the route @fastify/static registers under its `prefix` (`/public/*`, which also takes `/public/`) is not read, and nothing says so" }
  - { route: "GET /public/{**}", reason: "the route @fastify/static registers under its `prefix` is not read, and nothing says so" }
  - { route: "GET /example", reason: "Fastify's wildcard `*` also takes the path with nothing after its `/`; atlas reads `*` as one segment" }
  - { route: "GET /example/{**}", reason: "Fastify's wildcard `*` takes the rest of the path, slashes included; atlas reads `*` as one segment" }
  - { route: "GET /example/{}.png", reason: "a parameter with a regexp (`:file(^\\d+)`) followed by text is read as literal text" }
  - { route: "GET /example/near/{}-{}/radius/{}", reason: "parameters that share a segment (`:lat-:lng`) are read as literal text" }
  - { route: "GET /example/at/{}h{}m", reason: "parameters with regexps that share a segment with text (`:hour(^\\d{2})h:minute(^\\d{2})m`) are read as literal text" }
  - { route: "GET /example/posts", reason: "an optional last parameter (`:id?`) is read as the path with the parameter only, not also without it" }
  - { route: "POST /name:verb", reason: "`::`, Fastify's escaped colon, is read as two colons" }
extra:
  - { route: "GET /user", reason: "a prefixed plugin's route read without its prefix (`/v1`, `/v2`)" }
  - { route: "DELETE /user/{}", reason: "a prefixed plugin's route read without its prefix (`/v2`)" }
  - { route: "GET /dashboard", reason: "a nested prefixed plugin's route read without its prefixes (`/api/admin`)" }
  - { route: "PATCH /settings/{}", reason: "a nested prefixed plugin's route read without its prefixes (`/api/admin`)" }
  - { route: "GET /example/:file(^\\d+).png", reason: "a regexp parameter read as literal text" }
  - { route: "GET /example/near/:lat-:lng/radius/{}", reason: "parameters within a segment read as literal text" }
  - { route: "GET /example/at/:hour(^\\d{})h:minute(^\\d{})m", reason: "regexp parameters within a segment read as literal text (the regexps' `{2}` compared as parameters)" }
  - { route: "POST /name::verb", reason: "the escaped colon read as two colons" }
