  - { request: "PATCH /api/admin/settings/12/", reason: "trailing slash: Fastify treats `/api/admin/settings/12/` as another path than `/api/admin/settings/12` (`ignoreTrailingSlash` is false by default), which no route takes; atlas matches it to `/api/admin/settings/:key`" }
