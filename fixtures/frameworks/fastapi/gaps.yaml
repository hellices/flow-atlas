# Where atlas's reading differs from the routes FastAPI serves. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs.
# Sample requests atlas matches otherwise than Starlette dispatches them (dispatch.json). Starlette tries the routes
# in the order they are registered and takes the first that matches ("Route priority" in Starlette's routing guide,
# FastAPI's "Order matters"); a path no route takes, but would with its trailing `/` added or removed, is answered by
# the router with a 307 to that path (`redirect_slashes`, on by default), which reaches a route only as a new request.
