# How scripts/frameworks.mjs installs Blazor and asks it for the routes the application serves. Blazor is part of the
# .NET 10 (LTS) shared framework the SDK in use carries (global.json); the packages, the client script's included
# (Directory.Build.targets), are locked in packages.lock.json at one release, and `latest` takes the newest 10.x of them.
toolchain: dotnet
docs:
  - https://learn.microsoft.com/en-us/aspnet/core/blazor/fundamentals/routing?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/blazor/fundamentals/navigation?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/blazor/components/render-modes?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/blazor/components/class-libraries?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/blazor/fundamentals/static-files?view=aspnetcore-10.0
setup: dotnet restore --locked-mode
latest: dotnet restore -p:AspNetCoreVersion=10.* -p:NuGetLockFilePath=obj/latest.packages.lock.json
oracle: dotnet build oracle --no-restore -nologo -v q 1>&2 && dotnet run --project oracle --no-build
