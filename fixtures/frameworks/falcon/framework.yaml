# How scripts/frameworks.mjs installs Falcon and asks it for the routes the application serves. requirements.txt pins
# every package with its hashes and names no index, so each machine installs the same files from the index it uses.
toolchain: python
docs:
  - https://falcon.readthedocs.io/en/stable/api/routing.html
  - https://falcon.readthedocs.io/en/stable/api/app.html
  - https://falcon.readthedocs.io/en/stable/api/inspect.html
setup: uv venv -q --allow-existing && uv pip sync -q requirements.txt
latest: uv venv -q --allow-existing && uv pip install -q --upgrade -r pyproject.toml
oracle: .venv/bin/python oracle.py
