# How scripts/frameworks.mjs installs Slim and asks it for the routes the application serves.
toolchain: php
docs:
  - https://www.slimframework.com/docs/v4/objects/routing.html
  - https://www.slimframework.com/docs/v4/cookbook/enable-cors.html
setup: composer install --no-interaction --no-progress
latest: composer require --no-interaction --no-progress --update-with-all-dependencies 'slim/slim:*' 'slim/psr7:*'
oracle: php oracle.php
