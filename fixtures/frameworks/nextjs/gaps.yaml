# Where atlas's reading differs from the routes Next.js serves. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs.
missing:
  - { route: "GET /icon", reason: "a metadata image route (`icon.jsx`) is not read; a limit names it" }
  - { route: "GET /api/catalog/{}", reason: "the catch-all `[...path]` is read as a parameter with `**` after it (`/api/catalog/{path}/**`), which beside the parameter route `[id]` compares as one route of one segment or more" }
  - { route: "* /shop/{}", reason: "the catch-all `[...slug]` is read as a parameter with `**` after it (`/shop/{slug}/**`), which beside the parameter route `[category]` compares as one route of one segment or more" }
dispatch:
  - { request: "GET /_next/static/rest/of/it", reason: "the build's files are read as one route under `/_next/static`, their names coming from the build; a path no file of the build has reaches it, where Next.js finds nothing" }
