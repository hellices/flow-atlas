# Where atlas's reading differs from the routes Django serves. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs.
#
# The admin site's patterns (`path("admin/", admin.site.urls)`) are left out with a limit: the models they serve are
# those every installed app's admin module registers (django.contrib.auth's User and Group here, third-party apps'
# elsewhere, outside the files read), most of each model's pages take `<path:object_id>` before more segments, which
# atlas's path form does not hold, and the methods its views answer depend on the signed-in user (logout takes only
# POST from one); an anonymous user is sent to the login page by any method.
