  - { request: "PURGE /hello/", reason: "trailing slash: Hono's strict mode (the default) treats `/hello/` as another path than `/hello`, which no route takes for this method; atlas matches it to `/hello`" }
  - { request: "PUT /hello/", reason: "trailing slash: Hono's strict mode (the default) treats `/hello/` as another path than `/hello`, which no route takes for this method; atlas matches it to `/hello`" }
