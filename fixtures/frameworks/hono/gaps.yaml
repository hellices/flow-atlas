# Where atlas's reading differs from the routes Hono serves. Remove an entry when atlas reads it right; the test fails
# while a listed difference no longer occurs.
missing:
  - { route: "QUERY /search", reason: "`app.query` (QUERY method) is not read, and nothing says so" }
  - { route: "PURGE /cache", reason: "`app.on(method, path)` is not read, and nothing says so" }
  - { route: "PUT /post", reason: "`app.on([methods], path)` is not read, and nothing says so" }
  - { route: "DELETE /post", reason: "`app.on([methods], path)` is not read, and nothing says so" }
  - { route: "GET /greet", reason: "`app.on(method, [paths])` is not read, and nothing says so" }
  - { route: "GET /ja/greet", reason: "`app.on(method, [paths])` is not read, and nothing says so" }
  - { route: "GET /en/greet", reason: "`app.on(method, [paths])` is not read, and nothing says so" }
  - { route: "POST /endpoint", reason: "a chained route's verb with no path (`.get(path, h).post(h)`, the previous path) is not read, and nothing says so" }
  - { route: "DELETE /endpoint", reason: "a chained route's verb with no path (`.get(path, h).delete(h)`, the previous path) is not read, and nothing says so" }
  - { route: "GET /animal", reason: "an optional last parameter (`:type?`) is read as the path with the parameter only, not also without it" }
  - { route: "GET /post/{}/{}", reason: "a parameter with a regexp (`:date{[0-9]+}`) is read as literal text" }
  - { route: "GET /{**}", reason: "the fallback `app.get(\"*\")`, a path not starting with `/`, is not read, and nothing says so" }
extra:
  - { route: "GET /post/:date{}/:title{}", reason: "regexp parameters read as literal text (their regexps' braces compared as parameters)" }
