# Where atlas's reading differs from the routes Spring Boot serves. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs.
dispatch:
  - { request: "GET /api/members", reason: "Spring's RequestMappingHandlerMapping refuses a path an annotated route takes by another method (405) before the static resources' mapping is tried; atlas does not read the order of Spring's handler mappings, so the request reaches the static resources (`/**`)" }
  - { request: "GET /api/persons", reason: "Spring's RequestMappingHandlerMapping refuses a path an annotated route takes by another method (405) before the static resources' mapping is tried; atlas does not read the order of Spring's handler mappings, so the request reaches the static resources (`/**`)" }
  - { request: "GET /api/pets", reason: "Spring's RequestMappingHandlerMapping refuses a path an annotated route takes by another method (405) before the static resources' mapping is tried; atlas does not read the order of Spring's handler mappings, so the request reaches the static resources (`/**`)" }
  - { request: "GET /search", reason: "the router function takes it only with the parameter `type=person` (`param(...)`), which is not read; without it Spring passes the request on to the static resources (`/**`)" }
