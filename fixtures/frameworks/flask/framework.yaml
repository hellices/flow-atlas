# How scripts/frameworks.mjs installs Flask and asks it for the routes the application serves. requirements.txt pins
# every package with its hashes and names no index, so each machine installs the same files from the index it uses.
toolchain: python
docs:
  - https://flask.palletsprojects.com/en/stable/quickstart/#routing
  - https://flask.palletsprojects.com/en/stable/blueprints/
  - https://flask.palletsprojects.com/en/stable/views/
setup: uv venv -q --allow-existing && uv pip sync -q requirements.txt
latest: uv venv -q --allow-existing && uv pip install -q --upgrade -r pyproject.toml
oracle: .venv/bin/python oracle.py
