# How scripts/frameworks.mjs installs Django Ninja and asks Django for the routes the application serves.
# requirements.txt pins every package with its hashes and names no index, so each machine installs the same files from
# the index it uses.
toolchain: python
docs:
  - https://django-ninja.dev/guide/operations/
  - https://django-ninja.dev/guide/path-params/
  - https://django-ninja.dev/guide/routers/
  - https://django-ninja.dev/guide/urls/
  - https://django-ninja.dev/guide/versioning/
setup: uv venv -q --allow-existing && uv pip sync -q requirements.txt
latest: uv venv -q --allow-existing && uv pip install -q --upgrade -r pyproject.toml
oracle: .venv/bin/python oracle.py
