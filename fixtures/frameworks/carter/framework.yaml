# How scripts/frameworks.mjs installs Carter and asks it for the routes the application serves. Carter runs on the
# .NET 10 (LTS) shared framework the SDK in use carries (global.json); the packages are locked in packages.lock.json,
# and `latest` takes the newest stable Carter with the newest 10.x test host.
toolchain: dotnet
docs:
  - https://github.com/CarterCommunity/Carter/blob/main/README.md
  - https://github.com/CarterCommunity/Carter/tree/main/samples/CarterSample
  - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis/route-handlers?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/routing?view=aspnetcore-10.0
setup: dotnet restore --locked-mode
latest: dotnet restore -p:CarterVersion=* -p:AspNetCoreVersion=10.* -p:NuGetLockFilePath=obj/latest.packages.lock.json
oracle: dotnet build oracle --no-restore -nologo -v q 1>&2 && dotnet run --project oracle --no-build
