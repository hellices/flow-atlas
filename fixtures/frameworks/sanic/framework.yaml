# How scripts/frameworks.mjs installs Sanic and asks it for the routes the application serves. requirements.txt pins
# every package with its hashes and names no index, so each machine installs the same files from the index it uses.
toolchain: python
docs:
  - https://sanic.dev/en/guide/basics/routing.html
  - https://sanic.dev/en/guide/best-practices/blueprints.html
  - https://sanic.dev/en/guide/advanced/class-based-views.html
  - https://sanic.dev/en/guide/advanced/versioning.html
setup: uv venv -q --allow-existing && uv pip sync -q requirements.txt
latest: uv venv -q --allow-existing && uv pip install -q --upgrade -r pyproject.toml
oracle: .venv/bin/python oracle.py
