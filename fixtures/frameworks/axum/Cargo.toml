[workspace]
members = [".", "oracle"]
resolver = "3"

[package]
name = "axum-routes"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
