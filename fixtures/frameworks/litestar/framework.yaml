# How scripts/frameworks.mjs installs Litestar and asks it for the routes the application serves. requirements.txt pins
# every package with its hashes and names no index, so each machine installs the same files from the index it uses.
toolchain: python
docs:
  - https://docs.litestar.dev/latest/usage/routing/overview.html
  - https://docs.litestar.dev/latest/usage/routing/handlers.html
  - https://docs.litestar.dev/latest/usage/routing/parameters.html
  - https://docs.litestar.dev/latest/usage/static-files.html
setup: uv venv -q --allow-existing && uv pip sync -q requirements.txt
latest: uv venv -q --allow-existing && uv pip install -q --upgrade -r pyproject.toml
oracle: .venv/bin/python oracle.py
