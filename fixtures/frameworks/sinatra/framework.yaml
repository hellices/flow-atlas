# How scripts/frameworks.mjs installs Sinatra and asks it for the routes the application serves. Gemfile.lock pins
# every gem from rubygems.org, for each platform the fixture is run on; without one, setup writes it.
toolchain: ruby
docs:
  - https://sinatrarb.com/intro.html
  - https://sinatrarb.com/contrib/namespace
  - https://sinatrarb.com/contrib/multi_route
  - https://github.com/sinatra/mustermann/blob/main/mustermann/README.md
setup: >-
  if [ -f Gemfile.lock ]; then BUNDLE_FROZEN=true bundle install --quiet;
  else bundle lock --add-platform x86_64-linux aarch64-linux arm64-darwin x86_64-darwin && bundle install --quiet; fi
latest: bundle update --all --quiet
oracle: ruby oracle.rb
