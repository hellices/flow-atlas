# Where atlas's reading differs from the routes @koa/router serves. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs.
missing:
  - { route: "POST /users", reason: "a verb chained on the router after another (`router.get(...).post(...)`) is not read, and nothing says so" }
  - { route: "PUT /users/{}", reason: "a verb chained on the router after another (`router.get(...).put(...)`) is not read, and nothing says so" }
  - { route: "DELETE /users/{}", reason: "a verb chained on the router after another (`router.get(...).delete(...)`) is not read, and nothing says so" }
  - { route: "* /users/{}", reason: "`all` chained on the router after another verb is not read, and nothing says so" }
  - { route: "GET /articles/{}", reason: "a verb chained after `router.param(...)` is not read, and nothing says so" }
  - { route: "GET /articles/{}/comments", reason: "a verb chained after `router.param(...)` is not read, and nothing says so" }
  - { route: "GET /user/{}", reason: "a named route (`router.get(name, path, ...)`) is not read, and nothing says so" }
  - { route: "GET /sign-in", reason: "a named route (`router.get(name, path, ...)`) is not read, and nothing says so" }
  - { route: "* /login", reason: "`router.redirect(path, destination)`, which registers `all` at the path, is not read, and nothing says so" }
  - { route: "DELETE /sessions/{}", reason: "`router.del`, @koa/router's alias of `delete`, is not read, and nothing says so" }
  - { route: "PURGE /cache/{}", reason: "a verb other than get, post, put, patch, delete, head, options and all (`router.purge`) is not read, and nothing says so" }
  - { route: "GET /people", reason: "an array of paths is not read (named in a limit)" }
  - { route: "GET /persons", reason: "an array of paths is not read (named in a limit)" }
  - { route: "GET /profile", reason: "path-to-regexp 8's optional group `{/:id}` is read as literal text, not as two paths" }
  - { route: "GET /profile/{}", reason: "path-to-regexp 8's optional group `{/:id}` is read as literal text, not as two paths" }
  - { route: "GET /files/{**}", reason: "path-to-regexp 8's wildcard `*path` is read as literal text" }
  - { route: "GET /api/users", reason: "a router nested with `router.use(path, nested.routes())` in a router with a `prefix` is read without the mount path and the prefix, and nothing says so" }
  - { route: "GET /api/users/{}", reason: "a router nested with `router.use(path, nested.routes())` in a router with a `prefix` is read without the mount path and the prefix, and nothing says so" }
  - { route: "GET /api/posts", reason: "a router nested with `router.use(path, nested.routes())` in a router with a `prefix` is read without the mount path and the prefix, and nothing says so" }
  - { route: "GET /api/posts/{}", reason: "a router nested with `router.use(path, nested.routes())` in a router with a `prefix` is read without the mount path and the prefix, and nothing says so" }
  - { route: "POST /api/posts/{}/likes", reason: "a router nested with `router.use(path, nested.routes())` in a router with a `prefix` is read without the mount path and the prefix, and nothing says so" }
  - { route: "GET /api/v{}/status", reason: "a router's `prefix` constructor option is not read: its routes are read at the path written, and nothing says so" }
  - { route: "GET /api/v{}/legacy", reason: "a prefix set with `router.prefix()`, and the prefix of the router it is nested in with `use`, are not read (its `/` read as the root's), and nothing says so" }
  - { route: "GET /api/v{}/legacy/items", reason: "a prefix set with `router.prefix()`, and the prefix of the router it is nested in with `use`, are not read, and nothing says so" }
extra:
  - { route: "GET /{}", reason: "a nested router's route read without its mount path and its parent's prefix (`/api/users`, `/api/posts`)" }
  - { route: "POST /{}/likes", reason: "a nested router's route read without its mount path and its parent's prefix (`/api/posts`)" }
  - { route: "GET /status", reason: "a route read without its router's prefix (`/api/v:version`)" }
  - { route: "GET /items", reason: "a route read without its router's prefixes (`/api/v:version/legacy`)" }
  - { route: "GET /profile{/:id}", reason: "the optional group read as literal text" }
  - { route: "GET /files/*path", reason: "the wildcard read as literal text" }
dispatch:
  - { request: "GET /reports/latest", reason: "registration order: @koa/router runs the routes that match in the order they are registered (no `exclusive`), and `/reports/latest`, registered first, answers; atlas also matches `/reports/:id`" }
  - { request: "GET /reports/latest/", reason: "registration order: @koa/router runs the routes that match in the order they are registered (no `exclusive`), and `/reports/latest`, registered first, answers; atlas also matches `/reports/:id`" }
  - { request: "GET /dashboard", reason: "prefix (see `extra`): atlas also matches the extra `GET /{}`, the nested `users` router's `/:id` read without its mount path and prefix, which @koa/router serves at `/api/users/:id` only" }
  - { request: "GET /dashboard/", reason: "prefix (see `extra`): atlas also matches the extra `GET /{}`, the nested `users` router's `/:id` read without its mount path and prefix, which @koa/router serves at `/api/users/:id` only" }
  - { request: "GET /users", reason: "prefix (see `extra`): atlas also matches the extra `GET /{}`, the nested `users` router's `/:id` read without its mount path and prefix, which @koa/router serves at `/api/users/:id` only" }
  - { request: "GET /users/", reason: "prefix (see `extra`): atlas also matches the extra `GET /{}`, the nested `users` router's `/:id` read without its mount path and prefix, which @koa/router serves at `/api/users/:id` only" }
