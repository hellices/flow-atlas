  - { route: "GET /api/v:version/legacy", reason: "the parameter within the prefix's segment read as literal text" }
  - { route: "GET /api/v:version/legacy/items", reason: "the parameter within the prefix's segment read as literal text" }
  - { route: "GET /profile{/:id}", reason: "the optional group read as literal text" }
  - { route: "GET /files/*path", reason: "the wildcard read as literal text" }
  - { route: "GET /downloads/:\"file-name\"", reason: "the quoted parameter read as literal text" }
  - { route: "GET /archive/*\"rest-path\"", reason: "the quoted wildcard read as literal text" }
dispatch:
  - { request: "GET /reports/latest", reason: "registration order: @koa/router runs the routes that match in the order they are registered (no `exclusive`), and `/reports/latest`, registered first, answers; atlas also matches `/reports/:id`" }
  - { request: "GET /reports/latest/", reason: "registration order: @koa/router runs the routes that match in the order they are registered (no `exclusive`), and `/reports/latest`, registered first, answers; atlas also matches `/reports/:id`" }
