# Where atlas's reading differs from the routes @koa/router serves. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs.
missing:
  - { route: "POST /users", reason: "a verb chained on the router after another (`router.get(...).post(...)`) is not read, and nothing says so" }
  - { route: "PUT /users/{}", reason: "a verb chained on the router after another (`router.get(...).put(...)`) is not read, and nothing says so" }
  - { route: "DELETE /users/{}", reason: "a verb chained on the router after another (`router.get(...).delete(...)`) is not read, and nothing says so" }
  - { route: "* /users/{}", reason: "`all` chained on the router after another verb is not read, and nothing says so" }
  - { route: "GET /articles/{}", reason: "a verb chained after `router.param(...)` is not read, and nothing says so" }
  - { route: "GET /articles/{}/comments", reason: "a verb chained after `router.param(...)` is not read, and nothing says so" }
  - { route: "GET /user/{}", reason: "a named route (`router.get(name, path, ...)`) is not read, and nothing says so" }
  - { route: "GET /sign-in", reason: "a named route (`router.get(name, path, ...)`) is not read, and nothing says so" }
  - { route: "* /login", reason: "`router.redirect(path, destination)`, which registers `all` at the path, is not read, and nothing says so" }
  - { route: "DELETE /sessions/{}", reason: "`router.del`, @koa/router's alias of `delete`, is not read, and nothing says so" }
  - { route: "PURGE /cache/{}", reason: "a verb other than get, post, put, patch, delete, head, options and all (`router.purge`) is not read, and nothing says so" }
  - { route: "GET /people", reason: "an array of paths is not read (named in a limit)" }
  - { route: "GET /persons", reason: "an array of paths is not read (named in a limit)" }
  - { route: "GET /profile", reason: "path-to-regexp 8's optional group `{/:id}` is read as literal text, not as two paths" }
  - { route: "GET /profile/{}", reason: "path-to-regexp 8's optional group `{/:id}` is read as literal text, not as two paths" }
  - { route: "GET /files/{**}", reason: "path-to-regexp 8's wildcard `*path` is read as literal text" }
  - { route: "GET /downloads/{}", reason: "path-to-regexp 8's parameter with a quoted name (`:\"file-name\"`) is read as literal text" }
  - { route: "GET /archive/{**}", reason: "path-to-regexp 8's wildcard with a quoted name (`*\"rest-path\"`) is read as literal text" }
  - { route: "GET /api/v{}/status", reason: "a parameter that shares its segment with text (`v:version`, in the router's prefix) is read as literal text" }
  - { route: "GET /api/v{}/legacy", reason: "a parameter that shares its segment with text (`v:version`, in the prefix of the router it is nested in) is read as literal text" }
  - { route: "GET /api/v{}/legacy/items", reason: "a parameter that shares its segment with text (`v:version`, in the prefix of the router it is nested in) is read as literal text" }
extra:
