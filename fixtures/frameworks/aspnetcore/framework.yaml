# How scripts/frameworks.mjs installs ASP.NET Core and asks it for the routes the application serves. The shared
# framework is the .NET 10 (LTS) runtime the SDK in use carries (global.json); the packages are locked in
# packages.lock.json at its release, and `latest` takes the newest 10.x of them.
docs:
  - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/routing?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/minimal-apis/route-handlers?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/mvc/controllers/routing?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/map-static-files?view=aspnetcore-10.0
  - https://learn.microsoft.com/en-us/aspnet/core/fundamentals/openapi/aspnetcore-openapi?view=aspnetcore-10.0
setup: dotnet restore --locked-mode
latest: dotnet restore -p:AspNetCoreVersion=10.* -p:NuGetLockFilePath=obj/latest.packages.lock.json
oracle: dotnet build oracle --no-restore -nologo -v q 1>&2 && dotnet run --project oracle --no-build
