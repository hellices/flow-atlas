case: |
  A React app on React Router 5 whose strings name its own pages, and a React front whose strings are labels, sample
  routes and documentation links, both reading a server through a client that puts /api (app) or nothing (front)
  before each path. Seen in outline, twenty and immich: such strings were read as requests to the server. outline's
  `<Route>` comes from a module of its own, components/ProfiledRoute, which exports React Router's `Route` wrapped by
  Sentry or not, so its paths were calls; `<Redirect from to>`, a history's `push`, `useRouteMatch` and the paths
  listed to be tested with `startsWith` or `includes` were too, each an FA002 under /api. In twenty, a Lingui label
  (`` t`/month` ``), an input's placeholder, legacy settings paths listed in an array mapped into `<Route path>`, and a
  path given to a function that joins it to the documentation site's address another package holds came back as calls;
  in immich, a URL resolved against another host by `new URL(path, base)` was read with the client's prefix. Now the
  router's component is followed through the module that passes it on; React Router 5's Redirect, useHistory,
  useRouteMatch and matchPath name routes; a placeholder and a Lingui message are text for people; a value is followed
  through a local const, an array's tests and iterations and a function's parameter to where it goes, and is no request
  where it goes only to places that are none (a route, a test, a URL on another host); and a base held in a value
  leaves the URL unread with a limit. The helpers in routeHelpers return page paths that other files use: atlas reads
  where a string is written and does not follow a function's result to its callers, so they are still read, as the
  two FA002s show.
