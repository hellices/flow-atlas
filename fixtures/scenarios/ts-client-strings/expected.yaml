  - mobile->bff|GET /devices/{deviceId}/status
  - mobile->bff|POST /interactions
  - desktop->companion|POST /workspace
  - desktop->companion|GET /inbox/items
  - tools->api|GET /api/v1/notebooks
  - tools->api|POST /api/v1/notebooks/{notebookId}/search
calls:
