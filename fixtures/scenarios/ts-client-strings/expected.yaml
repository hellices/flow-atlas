  - mobile->bff|* /devices/{}/status @ mobile/src/bff/home.ts:36
  - mobile->bff|POST /interactions @ mobile/src/bff/home.ts:40
  - desktop->companion|POST /workspace based @ desktop/src/workspace.ts:23
