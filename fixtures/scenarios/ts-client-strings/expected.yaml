case: |
  TypeScript clients whose call files hold paths that are not requests: a mobile app's BFF adapter, a desktop app
  talking to its local companion server, and a tool calling an API under a base URL that ends in /api/v1.
  Seen in real runs: every string that looked like a path was read as a call. A path an adapter passes to its own
  lookup helper as a label (`requireAsset(assets, id, "/devices")`) matched the BFF's device list, so a chain appeared
  that the code does not make and the route nothing calls was not reported; a path compared with `===` or tested with
  `startsWith` came back as a call, the latter with the configured prefix put before it (an FA002 for /api/v1/api/v1);
  a `path` option joined to a workspace's directory and a link to a release page on another site came back as FA002s
  blamed on the companion server. Now a string after a call's first argument is no request unless a method stated before
  it makes it one, and a limit names the function it was handed to; a compared or tested string is no request; a
  `path` option is read from the root as Node's http.request defines it; and an absolute URL is read only for the
  loopback address or the target's configured origin, with a limit naming the other host. The one finding is the
  device list no client asks for.
surfaces:
  - bff|GET /feed
  - bff|GET /devices
  - bff|GET /devices/{deviceId}/status
  - bff|POST /interactions
  - companion|POST /workspace
  - companion|GET /inbox/items
  - api|GET /api/v1/notebooks
  - api|POST /api/v1/notebooks/{notebookId}/search
findings:
  - FA001|bff|GET /devices
limits:
  - "calls mobile->bff: paths handed to a function after its first argument are not read as requests: requireAsset (2, first at mobile/src/bff/home.ts:28)"
  - "calls desktop->companion: URLs to example.com (desktop/src/workspace.ts:14) are not read as requests to companion"
chains:
