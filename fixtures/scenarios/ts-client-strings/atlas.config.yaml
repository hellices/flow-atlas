components:
  - { name: mobile, path: mobile }
  - { name: bff, path: bff }
  - { name: desktop, path: desktop }
  - { name: companion, path: companion }
  - { name: tools, path: tools }
  - { name: api, path: api }
routes:
  - { component: bff, files: ["bff/src/**/*.ts"], styles: [express] }
  - { component: companion, files: ["companion/src/**/*.ts"], styles: [express] }
  - { component: api, files: ["api/src/**/*.ts"], styles: [express] }
calls:
  - { from: mobile, to: bff, files: ["mobile/src/bff/**/*.ts"] }
  # The desktop app talks to its local companion server on the loopback address.
  - { from: desktop, to: companion, files: ["desktop/src/**/*.ts"] }
  # The client's base URL ends in /api/v1 (tools/src/api-client.ts).
  - { from: tools, to: api, files: ["tools/src/**/*.ts"], prefix: /api/v1 }
