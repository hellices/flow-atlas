case: |
  A FastAPI backend and a React client that calls it through an authFetch wrapper.
  Seen in a real run: an agent endpoint registered by a library helper and a StaticFiles mount went unread, so the
  client's calls to them came back as FA002, and FA001 named routes that only a probe or the identity provider call.
  With the helper's fixed method configured, the mount read as StaticFiles serves it (GET, and HEAD by itself) and the
  two outside callers declared public, what remains is the three routes no client code calls. Inventory used to offer
  the Python decorators as Express routes and count none of the wrapper's calls. A mounted sub-application is not
  read; a limit says so rather than serving its whole subtree.
surfaces:
  - backend|DELETE /api/exports/{workspace_id}/{timestamp}
  - backend|GET /api/reports
  - backend|GET /api/reports/{*filename}
  - backend|GET /api/auth/callback
  - backend|GET /api/auth/session
  - backend|GET /api/templates/{name}
  - backend|GET /api/templates/{name}/raw
  - backend|GET /api/dashboard/summary
  - backend|GET /api/downloads/**
  - backend|GET /api/health
  - backend|HEAD /api/downloads/** (implicit)
  - backend|POST /api/reports/run
  - backend|POST /api/auth/logout
  - backend|POST /api/chat
findings:
