case: |
  A FastAPI backend and a React client that calls it through an authFetch wrapper.
  Seen in a real run: an agent endpoint registered by a library helper and a StaticFiles mount went unread, so the
  client's calls to them came back as FA002, and FA001 named routes that only a probe or the identity provider call.
  With the helper's fixed method configured, the mount read as StaticFiles serves it (GET, and HEAD by itself) and the
  two outside callers declared public, what remains is the three routes no client code calls. Inventory used to offer
  the Python decorators as Express routes and count none of the wrapper's calls. A mounted sub-application is not
  read; a limit says so rather than serving its whole subtree. The chat URL, chosen between a base and none
  (`base ? `${base}/api/chat` : "/api/chat"`), was two calls; it is one request, read once.
  atlas does not read into the wrapper, so `authFetch(url)` has no method it can read. Such a call to
  `/api/reports/${name}` used to reach `POST /api/reports/run` as well as the catch-all it reads, and one to
  `/api/templates/${name}` the PUT that saves a template, so both showed as callers of writes they never make. A call
  whose method is not read is now matched to the routes it fits only when they take one method; otherwise atlas leaves
  it unmatched, a limit names it, and the routes it fits are not reported as having no caller. `{filename:path}` was
  read as Spring's `{*filename}`, which takes no segment as well, so the call to `/api/reports` reached it beside
  `GET /api/reports`. Starlette compiles it as `.*` after the `/` written before it, as it compiles a mount; the path
  without that segment comes to it only by the redirect the router answers when no route serves a path, and
  `GET /api/reports` serves this one.
