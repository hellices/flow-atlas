case: |
  The same events API written twice, in Express and in Spring, with a k6 load script as its only client.
  Seen in a real run: the Express router is mounted at `${constants.API_PREFIX}/events`, a prefix from a module
  required through an alias, and atlas placed its routes at the root (/opt_out), so no client call matched them.
  Now a router's routes are read only under a mount path the code states as a literal or the configuration declares;
  the declared events router is served under /events and every load-script call matches, and the admin router,
  whose mount nobody declared, is left out with a limit instead of being placed at the root. The root route the app
  registers on the same prefix, `${constants.API_PREFIX}/`, is not read either, and a limit names its line.
surfaces:
  - java|GET /events/opt_out
  - java|POST /events/click
  - java|POST /events/session
  - java|POST /events/consent
  - java|POST /events/page_view
  - node|GET /events/opt_out
  - node|POST /events/click
  - node|POST /events/session
  - node|POST /events/consent
  - node|POST /events/page_view
findings:
