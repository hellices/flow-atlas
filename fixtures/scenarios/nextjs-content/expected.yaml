case: |
  A Next.js App Router site at the repository root: marketing pages beside a catch-all for content pages, an editor
  under a dynamic segment, a dashboard, one route handler, robots.ts and sitemap.ts, files in public/, and a middleware
  whose matcher names the pages it guards.
  Seen in a real run: a link to `/editor/${id}` reached the catch-all as well as the editor, though Next.js serves the
  dynamic segment first; the icon and manifest in public/ reached the catch-all too, though Next.js serves public files
  before any dynamic route; the matcher's `/login` was read as a request; a `<Link>` whose href is one of two paths was
  read with an unknown method; robots.ts and sitemap.ts were not read as routes; no page offered the links it renders
  as what can follow it; and the component written as `path: .` read no route at all. Now a call with a value in its
  path reaches every route Next.js may serve it by, down to the first that takes any value there; public files are
  implicit GET surfaces (with HEAD) that rank as static paths; a matcher is no request; both branches of a link are
  GET; robots.ts serves GET /robots.txt and sitemap.ts GET /sitemap.xml, implicit like public files, since crawlers
  request them by convention and no code of the app does; a page offers the links and forms its server components and
  layouts render as `next`; and `.` is the repository root. The one finding is the post list nothing requests.
  The editor and the catch-all, under dynamic segments, are rendered on each request and take any method (`*`); the
  other pages are read as prerendered, taking GET alone, and a limit names them.
