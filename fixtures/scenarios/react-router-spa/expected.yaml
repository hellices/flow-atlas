case: |
  A Django REST backend described by the OpenAPI document drf-spectacular writes, and a React single-page app on
  React Router that calls it through the client hey-api generates from that document.
  Seen in a real run: the app's own routes were read as requests to the backend, with no method: the `to` of a
  `NavLink`, the path `navigate()` goes to and the path of a route the router defines. React Router renders them in
  the browser; no request reaches the server. Now a string in a React Router component's attributes or in the
  arguments of its functions (known by the import from `react-router`) is no request. Where the navigation loads the
  document instead, the browser does request it: `redirectDocument()` sends the user to the backend's login page,
  read as the GET it is, and a plain `<a href="/">` is the GET of the root path it always was. Inventory offered the
  app's `src/pages/*.tsx` as Next.js pages; the package does not depend on next, so they are not offered.
surfaces:
  - backend|GET /api/status
  - backend|GET /api/members
  - backend|POST /api/members
  - backend|GET /api/members/{id}
  - backend|PUT /api/members/{id}
  - backend|PATCH /api/members/{id}
  - backend|DELETE /api/members/{id}
