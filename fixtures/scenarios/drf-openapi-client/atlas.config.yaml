components:
  - { name: frontend, path: frontend }
  - { name: backend, path: backend }
routes:
  # drf-spectacular's document (manage.py spectacular --file schema.yml); DRF's router writes every path with a
  # trailing slash (backend/project/urls.py).
  - { component: backend, openapi: backend/schema.yml, files: ["backend/**/*.py"] }
calls:
  # The generated client (frontend/js/api) and the code that calls it; the client has no base URL.
  - { from: frontend, to: backend, files: ["frontend/js/**/*.ts", "frontend/js/**/*.tsx"] }
