case: |
  A FastAPI backend in the shape of the full-stack template: an APIRouter per module with its own prefix, gathered in
  one api_router that the application includes under a prefix from its settings, and a React client generated from
  the OpenAPI document. Seen in a real run: no router prefix was read, so every route came back at the path its
  decorator writes (`GET /`, `GET /{id}`), the routes of different routers collided, all of them were reported as
  having no caller, and none of the client's calls, all under /api/v1, was matched, with no limit saying why.
  A literal `APIRouter(prefix=...)` and a literal `include_router(..., prefix=...)` are now joined to the routes, through
  the nested include and the imports that name the routers (`items.router` from `from app.api.routes import items`,
  `utils_router` imported by name), as FastAPI serves them. The prefix held in the settings is not read; the
  configuration declares where api_router is served (`mounts`, as for an Express router). A router included under a
  prefix the code does not spell out (an f-string) and one included nowhere are not read, and a limit says so for each.
surfaces:
