case: |
  A TypeScript monorepo: a Kotlin app calls a BFF, the BFF calls a core service, and the core service's outbound
  adapters and a Python agent call a storage service.
  Seen in a real run: an adapter that builds its URLs from `const base = ${baseUrl}/store/internal/v2` read the base
  itself as a request (two false FA002s) and lost the call made with it; the Python agent's f-string URL, whose value
  sits on the line after `client.post(`, was not read at all. Building this scenario showed two more: a BFF whose route
  file is also its call file read its own registrations as calls to the core service, and `res.send()` (or `res.status(201).send()`) in a
  handler was followed by name into the adapter's `send` function. Now the base joins the URLs built on it, the f-string call is
  read, a registration is no request and the handler's own parameters name no port. The adapters' calls start chains
  of their own, since nothing in the code shows which request runs them; the only finding is the route a retired
  client used to call, and its handler's request to the core service belongs to that route, which no chain starts at,
  so it starts none of its own; a journey whose order only the flow states stays Unknown. The core service's event
  streams are registered on paths held in consts (`fastify.get(outputPath, ...)`); they were missing with no sign but
  a lower count in coverage, and now a limit names each registration, line and expression. The Kotlin app names the
  path it asked in the exception it throws when the BFF is unavailable (`throw BffUnavailable("/messages")`); that
  label was read as a second call. Now a path given to an exception is no request, and a limit names the exception.
surfaces:
  - bff|GET /legacy/profiles
  - bff|POST /uploads
  - bff|POST /messages
  - core|GET /profiles
  - core|POST /uploads
  - core|POST /replies
  - store|GET /store/internal/object-info/**
  - store|POST /store/internal/v2/agent/images
  - store|POST /store/internal/v2/shares
  - store|POST /store/internal/v2/upload-tickets
findings:
  - FA001|bff|GET /legacy/profiles
chains:
  - agent->store|POST /store/internal/v2/agent/images
  - app->bff|POST /uploads + core|POST /uploads
  - app->bff|POST /messages + core|POST /replies
  - core->store|GET /store/internal/object-info/**
  - core->store|POST /store/internal/v2/shares
  - core->store|POST /store/internal/v2/upload-tickets
limits:
  - "core/src/events.ts:7 registers a path the file does not spell out (outputPath)"
  - "core/src/events.ts:11 registers a path the file does not spell out (`${snapshotPath}`)"
  - "calls app->bff: paths given to an exception or to a function that throws are not read as requests: BffUnavailable (1, first at app/src/main/kotlin/com/example/app/BffApi.kt:8)"
calls:
  - agent->store|POST /store/internal/v2/agent/images based @ agent/src/agent/images.py:13
  - app->bff|POST /uploads @ app/src/main/kotlin/com/example/app/BffApi.kt:4
  - app->bff|POST /messages @ app/src/main/kotlin/com/example/app/BffApi.kt:7
  - bff->core|POST /uploads based @ bff/src/routes.ts:7
  - bff->core|POST /replies based @ bff/src/routes.ts:12
  - bff->core|GET /profiles based @ bff/src/routes.ts:18
  - core->store|* /store/internal/object-info/{} based @ core/src/adapters/store-objects.ts:6
  - core->store|POST /store/internal/v2/{} based @ core/src/adapters/store-shares.ts:10
