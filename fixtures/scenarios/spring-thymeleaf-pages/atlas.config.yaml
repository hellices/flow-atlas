# One Spring Boot MVC application whose Thymeleaf templates are its only client, so they are a component of their own.
components:
  - { name: server, path: src/main/java }
  - { name: web, path: src/main/resources }
routes:
  - { component: server, files: ["src/main/java/**/*.java"], styles: [spring] }
calls:
  # Spring Boot's default Thymeleaf prefix classpath:/templates/; links are context-relative or page-relative.
  - { from: web, to: server, files: ["src/main/resources/templates/**/*.html"] }
publicSurfaces:
  # CatalogController: @GetMapping("/catalog") @ResponseBody, JSON for clients outside the repository
  - "server|GET /catalog"
