case: |
  A Spring Boot MVC application whose Thymeleaf templates are its only client, written the way the framework's own
  sample application writes them.
  Seen in a real run: routes were all read, but 2 of 25 requests the templates make were, so 14 routes came back as
  FA001 and 3 of 17 were in a chain. The templates link with a quoted base (`@{'/accounts?page=1'}`), with a value
  preprocessed into the path (`@{/accounts/__${account.id}__}`), page-relative (`@{__${account.id}__/edit}` on the
  page of GET /accounts/{accountId}), to a route that serves `/catalog.html`, and post forms with no action, which go
  to the URL of the page; handlers name their view in a `static final String` or return it from a private method, and
  answer a post with `redirect:`. Each is now read: a relative URL once for each page its template is rendered on, a
  redirect as a GET the reply leads to. The menu's links come in as fragment parameters (`@{__${link}__}`), and a
  fragment file wraps its fields in a `<form>` no route renders; neither is read, and limits name both.
