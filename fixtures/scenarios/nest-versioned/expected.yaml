case: |
  A NestJS API in the shape of an Nx monorepo's, served under a global prefix and URI versioning that its bootstrap
  sets, and an Angular client whose services request /api/v1/... and /api/v2/... . Seen in a real run: neither the
  prefix nor the version was read, so every route came back at its controller path (`GET /orders/{id}`), none of the
  client's calls was matched, every route was reported as having no caller and no limit said why; the configuration
  had no way to state the prefix either. Nest documents both: the global prefix goes before every route but those its
  `exclude` lists, matched without the version, and URI versioning puts `v<version>` after the prefix, from the
  method's `@Version`, else the controller's, else `defaultVersion`, none for VERSION_NEUTRAL. atlas finds the calls
  in the component's code that is not a test, reads their literals and serves each route at its path; an `exclude`
  entry built at run time is named in a limit, and the routes it might keep out are read under the prefix.
surfaces:
  - api|GET /api/v1/orders
  - api|GET /api/v1/orders/{id}
  - api|POST /api/v1/orders
  # The same path in version 1, the default, and in version 2, which the method states.
  - api|GET /api/v1/portfolio/performance
  - api|GET /api/v2/portfolio/performance
  # The controller states two versions.
  - api|GET /api/v1/reports
  - api|GET /api/v2/reports
  - api|POST /api/v1/auth/anonymous
  # Version-neutral, by the method and by the controller: the prefix and no version.
  - api|GET /api/auth/oidc/callback
  - api|GET /api/assets/{languageCode}/site.webmanifest
  # Excluded from the prefix by literal entries; neutral, so no version either.
  - api|GET /sitemap.xml
  - api|GET /.well-known/oauth-authorization-server
  # Excluded for GET by a RouteInfo entry; an excluded route keeps its version.
  - api|GET /v1/health
  - api|GET /api/v1/health/jobs
  - api|GET /api/v1/info
