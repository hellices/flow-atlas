components:
  - { name: web, path: apps/web }
routes:
  - { component: web, files: ["apps/web/app/**/*.{ts,tsx}"], styles: [next] }
calls:
  # The browser code of the app calls the route handlers of the same app.
  - { from: web, to: web, files: ["apps/web/components/**/*.tsx", "apps/web/lib/public-config-client.ts"] }
publicSurfaces:
  - "web|GET /"   # the home page, entered by its address
