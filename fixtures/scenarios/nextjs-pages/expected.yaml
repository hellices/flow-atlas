case: |
  A Next.js app whose pages link to each other and whose client code calls one route handler.
  Seen in a real run: 13 of the app's 15 request strings were page addresses, written as `<Link href>` or built by a
  helper for a share link, and atlas read no page as a route, so none of them matched and nothing said so; the helper's
  parameter type `"/m" | "/r"` was read as two more requests. Now each page is a GET surface at its folder path (with the
  HEAD Next.js answers itself), a link reaches the page it names, a literal type is no request, and inventory offers the
  pages. A link to the home page, `/`, reaches it too, though a lone `/` elsewhere is a separator, not a request.
surfaces:
  - web|GET /
  - web|GET /api/assistant
  - web|GET /create
  - web|GET /create/manual
  - web|GET /m
  - web|GET /notes/{slug}
  - web|GET /r
  - web|HEAD / (implicit)
  - web|HEAD /api/assistant (implicit)
  - web|HEAD /create (implicit)
  - web|HEAD /create/manual (implicit)
  - web|HEAD /m (implicit)
  - web|HEAD /notes/{slug} (implicit)
  - web|HEAD /r (implicit)
  - web|OPTIONS /api/assistant (implicit)
  - web|POST /api/assistant
findings: []
chains:
