case: |
  A FastAPI backend read from the document it generates, and a React app that calls it through a client
  @hey-api/openapi-ts generated from that document. Seen in a real run: the client's `GET /api/v1/users/me` reached
  `/api/v1/users/{user_id}` as well, so a route whose only caller reads the current user looked called, and deleting
  `readUserMe` would have hidden nothing. OpenAPI 3.x matches a concrete path before its templated counterparts, so
  between two routes of the document the request reaches `/api/v1/users/me` only; a call with a value in that segment
  (`deleteUser`'s `{user_id}`) still fits the templated one. Every function of the generated client counted as a
  caller, whether or not the app calls it, so a route the app never requests was not reported. A function of a file
  the generator marks as its own is read as a request only when another configured file names it: `testToken`,
  `createUser` and `readUserById` are named nowhere else, and their routes come back as FA001, with a limit naming
  them. The app's own `generate_unique_id_function` builds operationIds (`users-read_user_me`) that carry no rule
  atlas could find a handler by; every route stayed at the document's line with nothing said, and `trace` blamed
  TypeScript. A limit now says no handler was found.
