# How scripts/frameworks.mjs installs resty and runs the requests this app makes with it.
toolchain: go
docs:
  - https://github.com/go-resty/resty/blob/v2/README.md
  - https://pkg.go.dev/github.com/go-resty/resty/v2
setup: go mod download
latest: go get github.com/go-resty/resty/v2@latest && go mod tidy
oracle: go run oracle.go
