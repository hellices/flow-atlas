components:
  - { name: client, path: . }
  - { name: api, path: server }
calls:
  # The base URL comes from the build's configuration (ApiConfig, ".../api"); `HttpUrl.resolve` resolves a path
  # against it as a URL reference.
  - { from: client, to: api, files: ["src/main/kotlin/**/data/*RemoteDataSource.kt"], base: /api, join: resolve }
