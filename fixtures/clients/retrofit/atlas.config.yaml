components:
  - { name: client, path: . }
  - { name: api, path: server }
calls:
  # Each Retrofit service's base URL comes from the build's configuration (ApiConfig); its path is the prefix.
  - { from: client, to: api, files: ["src/main/kotlin/**/data/UserApi.kt"], prefix: /api/v1 }
  - { from: client, to: api, files: ["src/main/kotlin/**/data/AnalyticsApi.kt"], prefix: /analytics/v2 }
