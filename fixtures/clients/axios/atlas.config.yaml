components:
  - { name: client, path: . }
  - { name: api, path: server }
calls:
  # The `api` instance's base path is /api, the `billing` instance's /billing (src/http.js).
  - { from: client, to: api, files: ["src/users.js"], prefix: /api }
  - { from: client, to: api, files: ["src/billing.js"], prefix: /billing }
  - { from: client, to: api, files: ["src/status.js"] }
