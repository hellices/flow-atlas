missing:
  - { call: "GET /users/{}", reason: "`http.Get(base + \"/users/\" + id)` is read without the value concatenated after the path, and nothing says so" }
  - { call: "GET /users/search", reason: "the method of `http.Get(u.String())`, the URL built with `url.Parse(base + \"/users/search\")` and given a query, is not read: the URL is held in a value, and nothing says so" }
  - { call: "PUT /users/{}", reason: "a URL built with `url.JoinPath(base, \"users\", id)` is not read, and nothing says so" }
  - { call: "DELETE /users/{}", reason: "`base+\"/users/\"+id`, the URL `http.NewRequestWithContext(ctx, \"DELETE\", ...)` takes, is read without the value after the path, and nothing says so" }
  - { call: "GET /api/v1/invoices", reason: "the SDK client's paths are relative to its `BaseURL` (`\"invoices\"`, resolved by `BaseURL.Parse`), and a path without a leading `/` is read only where a call on one of the call source's receivers takes it first, or after a method written as a string: the client's own `newRequest(ctx, http.MethodGet, \"invoices\", nil)` takes it third, and its method is a parameter of the client's own function, which atlas does not follow, and nothing says so" }
  - { call: "POST /api/v1/invoices", reason: "the SDK client's path relative to its `BaseURL` (`\"invoices\"`), the third argument of its own `newRequest`, is not read, nor the method `http.MethodPost` given to it, and nothing says so" }
  - { call: "GET /api/v1/invoices/{}", reason: "the SDK client's path relative to its `BaseURL` (`fmt.Sprintf(\"invoices/%v\", id)`) is not read, nor the method given to `newRequest`, and nothing says so" }
  - { call: "PUT /api/v1/invoices/{}", reason: "the SDK client's path relative to its `BaseURL` (`\"invoices/\"+id`) is not read, nor the method given to `newRequest`, and nothing says so" }
  - { call: "DELETE /api/v1/invoices/{}", reason: "the SDK client's path relative to its `BaseURL` (`\"invoices/\"+id`) is not read, nor the method given to `newRequest`, and nothing says so" }
  - { call: "POST /api/v1/invoices/{}/lines/{}/refund", reason: "the SDK client's path relative to its `BaseURL` (`fmt.Sprintf(\"invoices/%v/lines/%d/refund\", ...)`) is not read, nor the method `\"POST\"` given to `newRequest`, and nothing says so" }
