components:
  - { name: client, path: . }
  - { name: api, path: server }
calls:
  - { from: client, to: api, files: ["users/**/*.go"] }
  # The billing client resolves its paths against its base URL, which ends in /api/v1/ (BaseURL.Parse).
  - { from: client, to: api, files: ["billing/**/*.go"], base: /api/v1/, join: resolve }
