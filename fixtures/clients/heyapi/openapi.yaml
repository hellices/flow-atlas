openapi: 3.1.0
info:
  title: Items API
  version: 1.0.0
servers:
  - url: https://api.example.com/api/v1
paths:
  /health:
    servers:
      - url: https://api.example.com
    get:
      operationId: getHealth
      responses:
        "200": { description: The service is up, content: { application/json: { schema: { type: object } } } }
  /items:
    get:
      operationId: listItems
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: X-Request-Id, in: header, schema: { type: string } }
      responses:
        "200": { description: The items, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Item" } } } } }
    post:
      operationId: createItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewItem" } } }
      responses:
        "201": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
    options:
      operationId: itemsOptions
      responses:
        "204": { description: The methods /items allows }
  /items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getItem
      responses:
        "200": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
    put:
      operationId: replaceItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewItem" } } }
      responses:
        "200": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
    patch:
      operationId: updateItem
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } }
      responses:
        "200": { description: The item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
    delete:
      operationId: deleteItem
      responses:
        "204": { description: Deleted }
    head:
      operationId: itemExists
      responses:
        "200": { description: The item exists }
  /items/{id}/archive:
    post:
      operationId: archiveItem
      description: Not called by the app.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Archived }
  /users/{userId}/items/{itemId}:
    get:
      operationId: getUserItem
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The user's item, content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
  /reports/{year}:
    get:
      operationId: getReport
      parameters:
        - { name: year, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The year's report, content: { application/json: { schema: { type: object } } } }
components:
  schemas:
    NewItem:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Item:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
