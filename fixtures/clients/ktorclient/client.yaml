# How scripts/frameworks.mjs runs the requests this app makes with the Ktor client.
toolchain: java
docs:
  - https://ktor.io/docs/client-create-and-configure.html
  - https://ktor.io/docs/client-requests.html
  - https://ktor.io/docs/client-default-request.html
  - https://ktor.io/docs/client-resources.html
  - https://ktor.io/docs/client-serialization.html
# Compiles the app, and the oracle against it.
setup: mvn -q -B clean test-compile dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
# The latest release of Ktor on Maven Central, in place of the pom's ktor.version.
latest: >-
  mvn -q -B -U clean test-compile dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
  -Dktor.version=$(curl -fsS https://repo1.maven.org/maven2/io/ktor/ktor-bom/maven-metadata.xml
  | sed -n 's:.*<version>\([0-9]*\.[0-9]*\.[0-9]*\)</version>.*:\1:p' | sort -V | tail -1)
oracle: java -cp "target/classes:target/test-classes:$(cat target/classpath.txt)" OracleKt
