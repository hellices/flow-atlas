# Where atlas's reading differs from the requests this code sends. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs.
missing:
  - { call: "GET /api/v1/users/{}", reason: "a path relative to the default request's base URL (`client.get(\"users/$id\")`) is not read, and nothing says so" }
  - { call: "GET /api/v1/users", reason: "a path relative to the default request's base URL (`client.get(\"users\") { url { parameters.append(...) } }`) is not read, and nothing says so" }
  - { call: "PUT /api/v1/users/{}", reason: "a path relative to the default request's base URL (`client.put(\"users/$id\")`) is not read, and nothing says so" }
  - { call: "PATCH /api/v1/users/{}", reason: "a path relative to the default request's base URL in `client.request(\"users/${id}\") { method = HttpMethod.Patch }` is not read, and nothing says so" }
  - { call: "DELETE /api/v1/users/{}", reason: "a path relative to the default request's base URL (`client.delete(\"users/\" + id)`) is not read, and nothing says so" }
  - { call: "HEAD /api/v1/users/{}", reason: "a path relative to the default request's base URL (`client.head(\"users/$id\")`) is not read, and nothing says so" }
  - { call: "POST /api/v1/users/{}/avatar", reason: "a path relative to the default request's base URL (`client.post(\"users/$id/avatar\")`) is not read, and nothing says so" }
  - { call: "POST /api/v1/auth/token", reason: "the relative `url` of `client.submitForm(url = \"auth/token\", ...)`, which posts, is not read, and nothing says so" }
  - { call: "POST /api/v1/users", reason: "a path built with `url { appendPathSegments(\"users\") }` in `client.post { }` is not read, and nothing says so" }
  - { call: "GET /api/v1/orders/{}/items", reason: "a path built with `url { appendPathSegments(\"orders\", id, \"items\") }` in `client.get { }` is not read, and nothing says so" }
  - { call: "GET /health", reason: "`client.get(\"/health\")` replaces the default request's base path, as Ktor resolves a path that starts with `/`; atlas puts the configured prefix before it, and nothing says so" }
  - { call: "GET /api/v1/articles", reason: "a typed request (`client.get(Articles())`, Ktor's Resources plugin) is not read: `@Resource(\"/articles\")` is read as a path with no method, and nothing says so" }
  - { call: "GET /api/v1/articles/{}", reason: "a typed request to a nested resource (`client.get(Articles.Id(id = id))`, `@Resource(\"{id}\")` under `@Resource(\"/articles\")`) is not read, and nothing says so" }
  - { call: "POST /api/v1/articles/new", reason: "a typed request to a nested resource (`client.post(Articles.New())`) is not read, and nothing says so" }
  - { call: "PUT /api/v1/articles/{}/edit", reason: "a typed request to a nested resource (`client.put(Articles.Id.Edit(...))`) is not read, and nothing says so" }
  - { call: "DELETE /api/v1/articles/{}", reason: "a typed request to a nested resource (`client.delete(Articles.Id(id = id))`) is not read, and nothing says so" }
extra:
