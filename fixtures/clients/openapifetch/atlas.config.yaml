components:
  - { name: client, path: . }
  - { name: api, path: server }
calls:
  # atlas reads the client's base URL where src/api/client.ts creates it (`createClient({ baseUrl: "/api/v1/" })`); the
  # prefix is for what is no call on that client, the path-based client `wrapAsPathBasedClient` makes of it.
  - { from: client, to: api, files: ["src/api/**/*.ts"], prefix: /api/v1 }
