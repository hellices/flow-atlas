# Where atlas's reading differs from the requests this code sends. Remove an entry when atlas reads it right; the test
# fails while a listed difference no longer occurs. atlas reads C# as text: a string that starts with `/`, and one without
# it that a call on `httpClient` or `client` (the call source's receivers) or `new HttpRequestMessage` takes, resolved
# against the configured base; with no method from HttpClient's own methods (`GetAsync`, `GetFromJsonAsync`, ...).
missing:
  - { call: "GET /api/users/{}", reason: "the GET of HttpClient's `GetFromJsonAsync` is not read: `` $\"users/{id}\" `` is read under the BaseAddress's path with its method unread, and nothing says so" }
  - { call: "GET /api/users", reason: "the GET of `GetFromJsonAsync` is not read: `` $\"users?role=...\" `` is read with its method unread, and nothing says so" }
  - { call: "POST /api/users", reason: "the POST of `PostAsJsonAsync` is not read: `\"users\"` is read with its method unread, and nothing says so" }
  - { call: "PUT /api/users/{}", reason: "the PUT of `PutAsync` is not read: `` $\"users/{id}\" `` is read with its method unread, and nothing says so" }
  - { call: "DELETE /api/users/{}", reason: "the DELETE of `DeleteAsync` is not read: `` $\"users/{id}\" `` is read with its method unread, and nothing says so" }
  - { call: "GET /api/orders/{}/items", reason: "a concatenation that starts with a relative URI (`\"orders/\" + orderId + \"/items\"`) is not read; only its last literal is, as a path of its own, and nothing says so" }
  - { call: "GET /health", reason: "the GET of `GetStringAsync` is not read: `\"/health\"`, which replaces the BaseAddress's path, is read with its method unread, and nothing says so" }
  - { call: "GET /api/projects", reason: "a URI held in a `const` of the class (`GetFromJsonAsync<Project[]>(Projects)`, `Projects = \"projects\"`) is not read, and nothing says so" }
  - { call: "PATCH /api/projects/{}", reason: "a template that starts with a `const` of the class (`` PatchAsJsonAsync($\"{Projects}/{id}\", ...) ``) is not joined to it nor read, and nothing says so" }
  - { call: "POST /api/projects/{}/archive", reason: "the class's `const` in `` $\"{Projects}/{id}/archive\" `` is not joined: read as a base before `/{}/archive`, without the POST of `PostAsync`, and nothing says so" }
  - { call: "POST /api/projects/{}/files", reason: "a concatenation that starts with a `const` of the class (`Projects + \"/\" + id + \"/files\"`) is not read; only its last literal is, as a path of its own, and nothing says so" }
  - { call: "GET /api/v2/reports/{}", reason: "the GET of `GetFromJsonAsync` is not read: `` $\"reports/{year}\" `` on the named client is read with its method unread, and nothing says so" }
extra:
