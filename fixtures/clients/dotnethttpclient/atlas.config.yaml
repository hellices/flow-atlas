components:
  - { name: client, path: . }
  - { name: api, path: server }
calls:
  # The base addresses in appsettings.json: the typed clients' Services:Api (".../api/"), and the named "reports" client's
  # Services:Reports (".../api/v2/"). HttpClient resolves a request's URI against its BaseAddress as a URI reference.
  - { from: client, to: api, files: ["src/App/Clients/UsersClient.cs", "src/App/Clients/ProjectsClient.cs"], base: /api/, join: resolve, receivers: [httpClient] }
  - { from: client, to: api, files: ["src/App/Clients/ReportsService.cs"], base: /api/v2/, join: resolve, receivers: [client] }
